<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia Quiz</title>
  <style>
    body { font-family: Georgia, serif; margin: 2rem; background: #f9f7f1; color: #222; }
    .question { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    .meta { font-size: 0.9rem; color: #666; margin-bottom: 0.5rem; }
    .opt { display: block; margin: 0.35rem 0; }
    button { margin-top: 1rem; padding: 0.6rem 1rem; border: 0; border-radius: 8px; background: #1f6feb; color: white; }
    .result { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Trivia</h1>
  <!-- <div id="quiz">Loading...</div> -->
  <label for="cat-select">Choose a category:</label>
  <select id="cat-select">
  </select>
  <br/>
  <label for="type-select">Choose a type:</label>
  <select id="type-select">
    <option value="boolean">True / False</option>
    <option value="multiple">Multiple Choice</option>
  </select>
  <br/>
  <label for="num-questions-select">Choose number of questions:</label>
  <select id="num-questions-select">
    <option value="1">1</option>
  </select>
  <br/>
  <button id="redirectBtn" onClick="goToQuiz()">Start Quiz</button>
  <!-- <div id="result" class="result"></div> -->

<script>
  function goToQuiz() {
    const category = document.getElementById('cat-select').value.trim();
    const type = document.getElementById('type-select').value.trim();
    const number = document.getElementById('num-questions-select').value.trim();

    window.location.href = `/quiz?category=${category}&type=${type}&amount=${number}`;
  }

  const selectDropdown = document.getElementById("cat-select");
  
  try {
    fetch("http://127.0.0.1:8000/categories")
      .then(response => response.json())
      .then(categories => {
        categories.forEach(category => {
          const option = document.createElement("option");
          option.value = category['id'];
          option.textContent = category['name'];
          selectDropdown.appendChild(option);
        });
      });
  } catch (error) {
    console.error("Error fetching categories:", error);
  }

  const selectNumDropdown = document.getElementById("num-questions-select");
  for (let num_question = 2; num_question <= 50; num_question++) {
    const option = document.createElement("option");
    
    option.value = num_question;
    option.textContent = num_question;
    
    selectNumDropdown.appendChild(option);
  }

</script>
</body>
</html>

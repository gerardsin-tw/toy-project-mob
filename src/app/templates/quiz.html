<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia Quiz</title>
  <style>
    :root {
      --bg: #f9f7f1;
      --fg: #222;
      --card-bg: #fff;
      --card-border: #ddd;
      --meta-fg: #666;
    }
    body.dark {
      --bg: #1a1a2e;
      --fg: #e0e0e0;
      --card-bg: #16213e;
      --card-border: #444;
      --meta-fg: #aaa;
    }
    body { font-family: Georgia, serif; margin: 2rem; background: var(--bg); color: var(--fg); }
    .question { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    .meta { font-size: 0.9rem; color: var(--meta-fg); margin-bottom: 0.5rem; }
    .opt { display: block; margin: 0.35rem 0; }
    button { margin-top: 1rem; padding: 0.6rem 1rem; border: 0; border-radius: 8px; background: #1f6feb; color: white; }
    button:disabled { background: #888; cursor: not-allowed; }
    .result { margin-top: 1rem; font-weight: bold; }
    .is-true {
      border-color: #28a745;
    }
    .is-false {
      border-color: #dc3545;
    }
    .firework {
      width: 100%;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .firework img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    #themeToggle { position: fixed; top: 1rem; right: 1rem; margin: 0; background: #555; color: #fff; cursor: pointer; z-index: 100; }
  </style>
</head>
<body>
<script>if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');</script>
<button id="themeToggle">🌙 Dark mode</button>
  <h1>Trivia</h1>
  <div id="quiz">Loading...</div>
  <button id="gradeBtn">Check Answers</button>
  <button id="newQuizBtn">New Quiz</button>
  <div id="result" class="result"></div>

  <script>
    const API_URL = "/trivia";

    async function loadQuiz() {
      const btn = document.getElementById("newQuizBtn");
      btn.disabled = true;
      const urlParams = new URLSearchParams(window.location.search);
      const category = urlParams.get('category');
      const type = urlParams.get('type');
      const amount = urlParams.get('amount');

      const container = document.getElementById("quiz");
      try {
        const res = await fetch(`${API_URL}?category=${category}&type=${type}&amount=${amount}`);
        if (!res.ok) {
          throw new Error(`Server error: ${res.status} ${res.statusText}`);
        }
        const questions = await res.json();

        container.innerHTML = "";
        questions.forEach((question, i) => {
          const card = document.createElement("section");
          card.className = "question";

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.textContent = `${question.category} • ${question.difficulty}`;

          const title = document.createElement("h3");
          title.textContent = `${i + 1}. ${question.question}`;

          card.appendChild(meta);
          card.appendChild(title);

          question.all_answers.forEach((opt, j) => {
            const id = `question${i}_o${j}`;
            const label = document.createElement("label");
            label.className = "opt";
            label.setAttribute("for", id);

            const input = document.createElement("input");
            input.type = "radio";
            input.name = `question${i}`;
            input.id = id;
            input.value = opt;

            label.appendChild(input);
            label.append(` ${opt}`);
            card.appendChild(label);
          });

          // store answer for grading
          card.dataset.correct = question.correct_answer;
          container.appendChild(card);
        });
      } catch (err) {
        container.textContent = "Failed to load quiz.";
        console.error(err);
      } finally {
        let remaining = 5;
        btn.textContent = `New Quiz (${remaining}s)`;
        const interval = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(interval);
            btn.disabled = false;
            btn.textContent = "New Quiz";
          } else {
            btn.textContent = `New Quiz (${remaining}s)`;
          }
        }, 1000);
      }
    }

    function gradeQuiz() {
      const cards = document.querySelectorAll(".question");
      let score = 0;

      cards.forEach((card, i) => {
        const selected = document.querySelector(`input[name="question${i}"]:checked`);
        if (selected && selected.value === card.dataset.correct) {
          score++;
          card.dataset.correctlyAnswered = "true";
          card.classList.add("is-true");
          card.classList.remove("is-false");
        } else {
          card.dataset.correctlyAnswered = "false";
          card.classList.add("is-false");
          card.classList.remove("is-true");
        }
      });

      document.getElementById("result").textContent =
        `Score: ${score}/${cards.length}`;

      if (score === cards.length) {
        const fireworks = document.createElement("img");
        fireworks.src = '/static/rick-roll-fireworks.gif';
        window.scrollTo(0, 0);
        fireworks.classList.add("firework");
        fireworks.timeout = setTimeout(() => {
          fireworks.remove();
        }, 3000);
        document.body.appendChild(fireworks);
      }
    }

    function newQuiz() {
      document.getElementById("result").textContent = "";
      document.querySelectorAll(".question").forEach(card => {
        card.classList.remove("is-true", "is-false");
      });
      const firework = document.querySelector(".firework");
      if (firework) firework.remove();
      loadQuiz();
    }

    document.getElementById("gradeBtn").addEventListener("click", gradeQuiz);
    document.getElementById("newQuizBtn").addEventListener("click", newQuiz);
    loadQuiz();

    const themeToggle = document.getElementById('themeToggle');
    if (document.body.classList.contains('dark')) themeToggle.textContent = '☀️ Light mode';
    themeToggle.addEventListener('click', function() {
      const isDark = document.body.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeToggle.textContent = isDark ? '☀️ Light mode' : '🌙 Dark mode';
    });
  </script>
</body>
</html>
